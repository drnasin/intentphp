name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        laravel: ['10.*', '11.*', '12.*', '13.*']
        exclude:
          # Laravel 10 (maintenance): tracks PHP 8.1–8.3; 8.4/8.5 are excluded.
          - php: '8.4'
            laravel: '10.*'
          - php: '8.5'
            laravel: '10.*'
          # Laravel 13 requires PHP ^8.3, so 8.2 is excluded.
          - php: '8.2'
            laravel: '13.*'

    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, xml
          coverage: none

      - name: Set Laravel version
        run: |
          composer require "illuminate/support:${{ matrix.laravel }}" "illuminate/console:${{ matrix.laravel }}" "illuminate/routing:${{ matrix.laravel }}" --no-interaction --no-update

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Audit runtime dependencies
        # Fails the build if any of the runtime require entries (or their
        # transitive runtime deps) has a known advisory. Dev deps are scoped
        # out because they're host-app-controlled (testbench/phpunit pull in
        # things we don't ship to consumers).
        run: composer audit --no-dev

      - name: Run tests
        run: vendor/bin/phpunit --colors=always
